<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Widget</title>
    <link rel="stylesheet" href="src/styles/style.css">
</head>
<body>
    <div id="chat-widget" class="chat-widget">
        <div class="chat-header">
            <div style="display:flex;align-items:center;gap:8px;">
                <button id="header-icon" class="header-icon" aria-label="AI HRM icon" style="display:none">
                    <img src="public/assets/icon.svg" alt="AI HRM" />
                </button>
                <h3>AI HRM</h3>
            </div>
            <button id="close-btn" class="close-btn">×</button>
        </div>
        <div id="messages" class="chat-messages">
            <div class="message bot">
                <p>Chào bạn! Tôi là một trợ lý AI được phát triển bởi Đội ngũ AI tại AlphaNDT. Bạn có câu hỏi nào liên quan đến Nhân sự không?</p>
            </div>
            <div id="suggested-questions" class="suggested-questions"></div>
        </div>
        <div class="chat-input-area">
            <textarea 
                id="message-input" 
                class="message-input" 
                placeholder="Nhập tin nhắn..."
                rows="1"
            ></textarea>
            <button id="send-btn" class="send-btn" title="Gửi">
                <svg id="send-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
                <svg id="stop-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                    <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                </svg>
            </button>
        </div>
    </div>

    <!-- Floating launcher (initially visible) -->
    <button id="chat-launcher" class="chat-launcher" title="Mở AI HRM">
        <img src="public/assets/icon.svg" alt="AI HRM" />
    </button>

    <script src="src/js/app.js"></script>
</body>
</html>
