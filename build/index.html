<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI HRM Widget - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .demo-container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .demo-container h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .demo-container p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .code-block {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            overflow-x: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            color: #333;
            margin-bottom: 20px;
        }
        .code-block code {
            color: #e83e8c;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            margin: 5px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>🤖 AI HRM Chat Widget</h1>
        <p>Chat widget đã được tích hợp thành công! Bạn có thể thấy widget ở góc dưới bên phải.</p>
        
        <div class="code-block">
<pre><!-- Cách nhúng vào website của bạn -->
<script 
    src="https://<strong>yourusername</strong>.github.io/<strong>chat_widget</strong>/embed.js"
    data-auto-init="true">
</script>
<div id="ai-hrm-widget"></div></pre>
        </div>
        
        <p>Hoặc với tùy chỉnh:</p>
        <div class="code-block">
<pre><script>
window.AIHRMWidget.init({
    apiBaseUrl: 'https://your-api.com',
    title: 'Trợ lý AI',
    placeholder: 'Hỏi đáp...'
});
</script></pre>
        </div>
        
        <a href="https://github.com/new" target="_blank" class="btn">🚀 Tạo GitHub Repo</a>
        <a href="https://github.com/features/actions" target="_blank" class="btn">📦 Xem Build Files</a>
    </div>

    <!-- Include the embed script -->
    <script src="embed.js"></script>
</body>
</html>
