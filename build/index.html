<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Widget Demo</title>
    <link rel="stylesheet" href="src/styles/style.css">
    <style>
        /* Demo page wrapper */
        .demo-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            padding: 20px;
        }
        .demo-card {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            margin-bottom: 600px; /* Space for chat widget */
        }
        .demo-card h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .demo-card p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .code-block {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        .code-block code {
            color: #e83e8c;
            font-size: 12px;
        }
        .demo-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            margin: 5px;
        }
        .demo-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="demo-wrapper">
        <div class="demo-card">
            <h1>🤖 AI HRM Chat Widget</h1>
            <p>Deploy thành công! Chat widget hoạt động ở góc dưới bên phải.</p>
            
            <div class="code-block">
<pre><code><script src="https://vaiwcern.github.io/chat-widget/build/embed.js"></script>
<div id="ai-hrm-widget"></div></code></pre>
            </div>
            
            <a href="https://github.com/Vaiwcern/chat-widget" target="_blank" class="demo-btn">📦 GitHub</a>
        </div>
    </div>

    <!-- Chat Widget (giống như index.html gốc) -->
    <div id="chat-widget" class="chat-widget">
        <div class="chat-header">
            <div style="display:flex;align-items:center;gap:8px;">
                <button id="header-icon" class="header-icon" aria-label="AI HRM icon" style="display:none">
                    <img src="public/assets/icon.svg" alt="AI HRM" />
                </button>
                <h3>AI HRM</h3>
            </div>
            <button id="close-btn" class="close-btn">×</button>
        </div>
        <div id="messages" class="chat-messages">
            <div class="message bot">
                <p>Chào bạn! Tôi là một trợ lý AI được phát triển bởi Đội ngũ AI tại AlphaNDT. Bạn có câu hỏi nào liên quan đến Nhân sự không?</p>
            </div>
            <div id="suggested-questions" class="suggested-questions"></div>
        </div>
        <div class="chat-input-area">
            <textarea 
                id="message-input" 
                class="message-input" 
                placeholder="Nhập tin nhắn..."
                rows="1"
            ></textarea>
            <button id="send-btn" class="send-btn" title="Gửi">
                <svg id="send-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
                <svg id="stop-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                    <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                </svg>
            </button>
        </div>
    </div>

    <!-- Floating launcher -->
    <button id="chat-launcher" class="chat-launcher" title="Mở AI HRM">
        <img src="public/assets/icon.svg" alt="AI HRM" />
    </button>

    <script src="src/js/app.js"></script>
</body>
</html>
